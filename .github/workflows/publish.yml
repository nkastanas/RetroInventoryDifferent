name: Publish GHCR Images

# A push to main publishes :latest after the code has been tested locally.
# A version tag such as v1.0.0 publishes that version, and the workflow can
# also be started manually with a custom image tag.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag, for example test or v1.0.0"
        required: true
        default: "test"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: ./api
            image: retroinventorydifferent-api

          - name: Web
            context: ./web
            image: retroinventorydifferent-web

          - name: Storefront
            context: ./storefront
            image: retroinventorydifferent-storefront

          - name: Showcase
            context: ./showcase
            image: retroinventorydifferent-showcase

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          GIT_REF_TYPE: ${{ github.ref_type }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GIT_REF_TYPE" = "tag" ]; then
            echo "value=$GIT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nkastanas/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ghcr.io/nkastanas/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nkastanas/RetroInventoryDifferent
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
